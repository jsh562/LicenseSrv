# Optional low-memory PostgreSQL settings for a NATIVE LicenseSrv dev/self-host instance.
#
# Stock PostgreSQL 16 ships shared_buffers=128MB, max_connections=100, work_mem=4MB — sized for a shared
# database server, not for one application with a 10-connection pool. These values mirror the `db` service
# command in docker-compose.yml so both paths behave the same.
#
# HOW TO APPLY
#   Linux    sudo tee -a /etc/postgresql/16/main/postgresql.conf < scripts/native/postgres-tuning.conf
#            sudo systemctl restart postgresql
#   macOS    cat scripts/native/postgres-tuning.conf >> /opt/homebrew/var/postgresql@16/postgresql.conf
#            brew services restart postgresql@16
#   Windows  append to C:\Program Files\PostgreSQL\16\data\postgresql.conf, then:
#            Restart-Service postgresql-x64-16
#
#   Locate the active file if unsure:  psql -U postgres -c 'SHOW config_file'
#
# Appending is safe: PostgreSQL applies the LAST occurrence of a duplicated setting, so these override the
# defaults above them. shared_buffers and max_connections need a restart; work_mem and maintenance_work_mem
# take effect on `SELECT pg_reload_conf()`.
#
# THIS IS OPTIONAL. It is a right-sizing measure, not a fix — a native Postgres serving one small database
# is already modest (~30 MB resident measured under Docker), because shared_buffers pages are touched
# lazily rather than reserved up front. Skip it if this instance is shared with other databases.

# --- LicenseSrv native tuning ---------------------------------------------------------------------

# Shared page cache. 64MB comfortably holds a dev-scale LicenseSrv working set.
shared_buffers = 64MB

# Must stay above the app's DB_POOL_MAX (default 10) plus the migration job and any interactive psql.
# NOTE ON WINDOWS: PostgreSQL uses one OS PROCESS per connection, and Windows processes are markedly more
# expensive than Linux forks — so this ceiling costs more on Windows than the same number would on Linux.
# Raise it only as far as you actually need.
max_connections = 25

# Per-sort/hash working memory. Allocated PER OPERATION, not per connection, so a single query with several
# sorts can use a multiple of this. The app's queries are small and index-driven.
work_mem = 2MB

# Used by VACUUM, CREATE INDEX, and ALTER TABLE ADD FOREIGN KEY. Lower than stock (64MB) but still ample
# for this schema's 16 migrations.
maintenance_work_mem = 32MB
