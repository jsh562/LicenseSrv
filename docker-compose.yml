# Reference self-host stack (E006, OR-014/015). One command — `docker compose up` — brings up
# PostgreSQL, runs the gated migration job to completion, then starts the API. All configuration comes
# from the environment; secrets are file-mounted (never baked into the image), demonstrating DDR-005.
#
# Ordering (OR-015): api starts only after the db healthcheck passes AND the one-shot migrate exits 0.
#
# Before first run, create the secret files under ./secrets/ (see .env.example):
#   secrets/db_password       secrets/database_url       secrets/api_key_secret

services:
  db:
    image: postgres:16-alpine
    # Right-sized for a self-host / dev-scale dataset rather than Postgres' stock defaults
    # (shared_buffers=128MB, max_connections=100, work_mem=4MB). max_connections stays comfortably above
    # the API's DB_POOL_MAX (default 10) plus the one-shot migrate job and any interactive psql session.
    command: >
      postgres
      -c shared_buffers=64MB
      -c max_connections=25
      -c work_mem=2MB
      -c maintenance_work_mem=32MB
    mem_limit: 256m
    environment:
      POSTGRES_USER: licensesrv
      POSTGRES_DB: licensesrv
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U licensesrv -d licensesrv"]
      interval: 5s
      timeout: 3s
      retries: 15
    # No host port exposure by default — only the API is reachable.

  migrate:
    build: .
    command: ["node", "dist/server/db/migrate.js"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
    secrets:
      - database_url

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Node reads the cgroup limit to size its V8 heap. With NO limit it sees the whole host (or the whole
    # WSL2 VM) and picks a large max-old-space, so it GCs lazily and RSS drifts well past what this service
    # actually needs (~19 MB heap in practice). A tight limit plus an explicit --max-old-space-size makes
    # V8 collect promptly. `mem_limit` is the Compose-v2 non-swarm form; `deploy.resources.limits` is
    # silently ignored by `docker compose up`.
    mem_limit: 384m
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      NODE_OPTIONS: --max-old-space-size=192
      DATABASE_URL_FILE: /run/secrets/database_url
      API_KEY_SECRET_FILE: /run/secrets/api_key_secret
    secrets:
      - database_url
      - api_key_secret
    ports:
      - "8080:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - >
          node -e "fetch('http://127.0.0.1:8080/internal/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 20

secrets:
  db_password:
    file: ./secrets/db_password
  database_url:
    file: ./secrets/database_url
  api_key_secret:
    file: ./secrets/api_key_secret
