name: activation

# CI for machine activation & seat enforcement (E009): the server activation module (runtime /v1 activate/
# deactivate + admin registry, consuming the E004 signer and the E008 license snapshot) plus the React SPA
# Activations view. Gates: typecheck + lint, the real-Postgres integration suite (Testcontainers) with the
# >=80% coverage gate, the SPA component suite + coverage, a production-scope dependency audit, and a semgrep
# scan over the activation + console + SPA sources.

on:
  push:
    paths:
      - "src/server/modules/activation/**"
      - "src/server/modules/signing/token.ts"
      - "src/server/modules/signing/keystore-signer.ts"
      - "src/server/console/**"
      - "src/admin-ui/src/pages/licensing/Activations.tsx"
      - "migrations/0008_activation.sql"
      - ".github/workflows/activation.yml"
  pull_request:
    paths:
      - "src/server/modules/activation/**"
      - "src/server/modules/signing/token.ts"
      - "src/server/modules/signing/keystore-signer.ts"
      - "src/server/console/**"
      - "src/admin-ui/src/pages/licensing/Activations.tsx"
      - "migrations/0008_activation.sql"
      - ".github/workflows/activation.yml"

jobs:
  server:
    name: server (activation module + real Postgres)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # ubuntu-latest ships Docker → Testcontainers spins up Postgres 16 for the activation integration suite.
      - name: Tests + >=80% coverage gate
        run: npm run test:cov
      - name: Production dependency audit (fail on high/critical)
        run: npm audit --omit=dev --audit-level=high

  spa:
    name: spa (Activations view)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/admin-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/admin-ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Component tests + >=80% coverage gate
        run: npm run test:cov
      - name: SPA production dependency audit (fail on high/critical)
        run: npm audit --omit=dev --audit-level=high

  semgrep:
    name: semgrep (activation + console + SPA)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep scan (typescript + OWASP top-ten)
        run: >
          semgrep scan --error --config p/typescript --config p/owasp-top-ten
          src/server/modules/activation src/server/console src/admin-ui/src/pages/licensing
