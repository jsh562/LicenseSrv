name: lease

# CI for the floating & concurrent-seat lease module (E015): the runtime acquire/renew/release plane (race-safe
# advisory-lock count+insert, fence-guarded renew, idempotent release), the fail-open time-driven reclaim sweeper
# + revoke-reclaim path wired into main.ts, the admin lease registry + force-release plane, and the E004-signed
# short-TTL lease handle (LICSRV-LEASE-v1 domain — reusing the signer, no new crypto). Gates: typecheck + lint,
# the real-Postgres integration suite (Testcontainers) with the >=80% line+branch coverage gate on
# src/server/modules/lease/**, a production-scope dependency audit, and a semgrep scan over the lease sources.

on:
  push:
    paths:
      - "src/server/modules/lease/**"
      - "migrations/0011_leases.sql"
      - "src/server/app.ts"
      - "src/server/main.ts"
      - ".github/workflows/lease.yml"
  pull_request:
    paths:
      - "src/server/modules/lease/**"
      - "migrations/0011_leases.sql"
      - "src/server/app.ts"
      - "src/server/main.ts"
      - ".github/workflows/lease.yml"

jobs:
  server:
    name: server (lease module + real Postgres)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # ubuntu-latest ships Docker → Testcontainers spins up Postgres 16 for the lease integration suite
      # (acquire/renew/release + concurrency race; reclaim + revoke-reclaim; stale-renew rejection; RLS isolation;
      # registry/force-release RBAC+CSRF; audit attribution; no-key/no-raw-holder/no-handle-secret/no-card
      # secret-leakage; per-API-key rate-limit; fast-ack perf) with the >=80% line+branch coverage gate.
      - name: Tests + >=80% coverage gate
        run: npm run test:cov
      - name: Production dependency audit (fail on high/critical)
        run: npm audit --omit=dev --audit-level=high

  semgrep:
    name: semgrep (lease)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Semgrep scan (typescript + OWASP top-ten)
        run: >
          semgrep scan --error --config p/typescript --config p/owasp-top-ten
          src/server/modules/lease
